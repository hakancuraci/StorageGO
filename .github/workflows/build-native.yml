name: Build native libraries and .NET package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go code
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Build Linux shared library
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p artifacts/linux-x64
          go build -trimpath -buildmode=c-shared -o artifacts/linux-x64/libstoragego.so .
      - name: Verify chunk ABI header
        run: |
          for symbol in StorageGO_ABIVersion StorageGO_CreateClient StorageGO_Invoke StorageGO_CloseClient StorageGO_FreeResult StorageGO_OpenRead StorageGO_OpenWrite StorageGO_ReadChunk StorageGO_WriteChunk StorageGO_FlushTransfer StorageGO_CloseTransfer; do
            grep -Fq "${symbol}(" artifacts/linux-x64/libstoragego.h || { echo "Missing ABI declaration: ${symbol}"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: storagego-linux-x64
          path: artifacts/linux-x64/
          if-no-files-found: error

  win-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Enable MinGW for CGO
        shell: pwsh
        run: |
          $candidates = @(
            'C:\msys64\ucrt64\bin',
            'C:\msys64\mingw64\bin',
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
          )
          $gccDirectory = $candidates |
            Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } |
            Select-Object -First 1
          if (-not $gccDirectory) {
            throw 'MinGW GCC was not found on the Windows runner.'
          }
          $gccDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test Go code
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Build Windows shared library
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force artifacts/win-x64 | Out-Null
          go build -trimpath -buildmode=c-shared -o artifacts/win-x64/storagego.dll .
      - name: Verify chunk ABI header
        shell: pwsh
        run: |
          $header = Get-Content -Raw artifacts/win-x64/storagego.h
          $symbols = @(
            'StorageGO_ABIVersion', 'StorageGO_CreateClient', 'StorageGO_Invoke',
            'StorageGO_CloseClient', 'StorageGO_FreeResult', 'StorageGO_OpenRead',
            'StorageGO_OpenWrite', 'StorageGO_ReadChunk', 'StorageGO_WriteChunk',
            'StorageGO_FlushTransfer', 'StorageGO_CloseTransfer'
          )
          foreach ($symbol in $symbols) {
            if ($header -notmatch "\b$symbol\(") {
              throw "Missing ABI declaration: $symbol"
            }
          }
      - name: Verify .NET chunk interop
        shell: pwsh
        run: ./tests/run-interop.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: storagego-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error

  dotnet-package:
    needs: [linux-x64, win-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: storagego-linux-x64
          path: artifacts/linux-x64
      - uses: actions/download-artifact@v7
        with:
          name: storagego-win-x64
          path: artifacts/win-x64
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build wrapper
        run: dotnet build StorageGO.sln -c Release -p:ContinuousIntegrationBuild=true
      - name: Pack wrapper and native runtimes
        run: dotnet pack dotnet/StorageGO.Client/StorageGO.Client.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: StorageGO-dotnet-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
